<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - GatsMapping Commandes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #014e9b;
            color: white;
        }
        .sidebar h4 {
            color: #c41726;
            font-weight: bold;
        }
        .nav-link {
            color: white;
            padding: 10px 15px;
            margin: 5px 0;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            background-color: #014e9b;
            color: white;
        }
        .nav-link.active {
            background-color: #014e9b;
            color: white;
            font-weight: bold;
        }
        .nav-link i {
            margin-right: 10px;
            color: white;
        }
        .main-content {
            padding: 20px;
            margin-left: 250px;
        }
        .card {
            border: none;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .stat-card {
            background: linear-gradient(145deg, #014e9b, #134a27);
            color: white;
        }
        .commande-card {
            transition: transform 0.2s;
        }
        .commande-card:hover {
            transform: translateY(-5px);
            background-color: #f8f9fa;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
        }
        .status-active {
            background-color: #134a27;
            color: white;
        }
        .status-annulee {
            background-color: #c41726;
            color: white;
        }
        .btn-primary {
            background-color: #014e9b;
            border-color: #014e9b;
        }
        .btn-primary:hover {
            background-color: #003d82;
            border-color: #003d82;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="position-sticky pt-3">
                    <h4 class="text-center mb-4">GatsMapping Admin</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="/admin">
                                <i class="bi bi-speedometer2"></i> Tableau de bord
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/menu">
                                <i class="bi bi-plate"></i> Menu
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">{{ title }}</h1>
                </div>

                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function annulerCommande(id) {
            if (confirm('Êtes-vous sûr de vouloir annuler cette commande ?')) {
                try {
                    const response = await fetch(`/admin/commandes/${id}/annuler`, {
                        method: 'POST'
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        window.location.reload();
                    } else {
                        alert('Erreur lors de l\'annulation');
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    alert('Erreur lors de l\'annulation');
                }
            }
        }
    </script>
</body>
</html>
